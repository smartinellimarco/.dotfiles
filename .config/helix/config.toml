# TODO: 'mic' 'mac' don't work
theme = "nord"

[editor]
cursorline = true
line-number = "relative"
color-modes = true
popup-border = "all"
rainbow-brackets = true
idle-timeout = 50
completion-timeout = 5
completion-replace = true
completion-trigger-len = 1
default-line-ending = "native"
trim-final-newlines = true
trim-trailing-whitespace = true
preview-completion-insert = false

[editor.workspace-trust]
level = "insecure"

[editor.soft-wrap]
enable = true

[editor.statusline]
left = [
  "mode",
  "spacer",
  "current-working-directory",
  "file-name",
  "version-control",
  "spacer",
  "file-modification-indicator"
]
right = [
  "spinner",
  "spacer",
  "diagnostics",
  "workspace-diagnostics",
  "position-percentage",
  "position"
]

[editor.cursor-shape]
insert = "bar"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.word-completion]
enable = true
trigger-length = 1

[editor.gutters]
layout = ["diff", "spacer", "line-numbers", "spacer"]

[editor.gutters.line-numbers]
min-width = 1

[editor.smart-tab]
enable = false
